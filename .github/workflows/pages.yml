name: Deploy evaluation report

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Publishes via the `gh-pages` branch (Deploy from a branch), which is more
# reliable than actions/deploy-pages when the Pages "GitHub Actions" source
# has not been enabled yet.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate HTML report
        run: npm run report

      - name: Prepare site
        run: |
          mkdir -p _site
          cp reports/evaluation-report.html _site/index.html
          cp reports/evaluation-report.html _site/evaluation-report.html
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
